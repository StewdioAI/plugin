name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test and package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: plugin-ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Test packaging and versioning
        run: npm run test:integration
      - name: Build plugin bundle
        run: npm run package
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Version and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: plugin-release
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Resume an already pushed version on reruns
        id: previous
        run: |
          commit=$(git log -1 --format=%H --fixed-strings --grep="Release-Source: $GITHUB_SHA")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ -n "$commit" ]; then
            git checkout --detach "$commit"
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Version, verify, and push the release commit and tag
        id: version
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        run: |
          for attempt in 1 2 3; do
            if [ -z "$PREVIOUS_COMMIT" ]; then
              git fetch origin main
              git checkout --detach origin/main
            fi
            npm ci
            if [ -z "$PREVIOUS_COMMIT" ]; then
              summary=$(git log -1 --format=%s "$GITHUB_SHA")
              npm run changeset -- --patch plugin --message "$summary"
              npm run version:plugin
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add .changeset CHANGELOG.md package.json package-lock.json .codex-plugin/plugin.json .claude-plugin/plugin.json
              version=$(node -p 'require("./package.json").version')
              git commit -m "chore: release v$version" -m "Release-Source: $GITHUB_SHA"
            fi
            version=$(node -p 'require("./package.json").version')
            node scripts/validate-release.mjs "v$version"
            npm run test:integration
            npm run package
            if [ -n "$PREVIOUS_COMMIT" ]; then
              break
            fi
            git tag -a "v$version" -m "Stewdio Plugin $version"
            if git push --atomic origin HEAD:main "refs/tags/v$version"; then
              break
            fi
            git tag -d "v$version"
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload verified plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/stewdio-plugin-${{ steps.version.outputs.version }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Publish release with plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./package.json").version')
          awk '/^## / { if (found) exit; found=1; next } found { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "v$version" > /dev/null 2>&1; then
            gh release create "v$version" "dist/stewdio-plugin-$version.zip" --verify-tag \
              --title "Stewdio Plugin v$version" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
